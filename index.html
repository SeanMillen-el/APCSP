<!DOCTYPE html>
<html lang="en">
  <head>
    <title>LML</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body class="body">
    <div class="container mt-5">
      <div class="row">
        <div class="col-12 text-center bg-secondary text-white header">
          <h1>APCSP create task</h1>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 offset-md-3">
          <div class="input-group mt-3">
            <input
              type="text"
              id="nameInput"
              class="form-control"
              placeholder="Enter a Name:"
            />
            <div class="input-group-append">
              <button
                id="addNameBtn"
                class="btn btn-secondary btn-outline-light ms-2"
              >
                Add Name
              </button>
            </div>
          </div>
          <ul id="nameList" class="list-group"></ul>
          <div id="randomName" class="mt-3 text-center"></div>
          <button
            id="pickRandomBtn"
            class="btn btn-dark mt-3 btn-outline-light"
          >
            Pick Random Name
          </button>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
